[package]
name = "forkyard"
version.workspace = true
description = "Fast, local Git client for the desktop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "forkyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitcore = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# System notifications and clipboard (otherwise the WebView prompts for them or refuses).
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Only for a WebView2 setting that Tauri doesn't pass through (disabling browser shortcuts).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
