name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forkyard version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15 …
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      description: Output of `git --version`
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      description: Paste the error text if there is one. Please remove any tokens or private paths.
      render: text
