name: Release

# Builds installers for every supported system when a version tag is pushed
# (`git tag v1.0.0 && git push origin v1.0.0`), attaches them to one release and publishes it
# once every build succeeded. If a build fails, the release stays a draft.
#
#   Windows  x64 (.msi, .exe) and ARM64 (.exe, cross-compiled on x64)
#   macOS    Apple Silicon and Intel (.dmg, .app.tar.gz; Intel is cross-compiled)
#   Linux    x64 and ARM64 (.deb, .rpm, .AppImage), built on Ubuntu 22.04 for an older glibc
#
# Updater artifacts: every installer gets a `.sig` file, and `latest.json` lists them for the in-app
# updater. All matrix targets merge into one `latest.json` on the draft; it is covered by SHA256SUMS.txt.
#
# GitHub only offers ARM64 Linux runners to public repositories, so that build is skipped
# while the repository is private. Run the workflow by hand with the tag to add it later.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.0.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Configure Git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release:
    name: Create draft release
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; fi
          if [ "$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json)" = "$(tr -d '\n' < src-tauri/updater-test-key.pub)" ]; then
            echo "::error::src-tauri/tauri.conf.json still has the test public key – insert the release key first"; exit 1
          fi
      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the app version $version in Cargo.toml"
            exit 1
          fi
      - name: Create or reuse the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            notes=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Forkyard $TAG" \
              -f body="${notes:-See CHANGELOG.md for what is new.}" -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Choose the build targets
        id: matrix
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          targets='[
            {"name":"Linux x64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","args":""},
            {"name":"Windows x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc","args":""},
            {"name":"Windows ARM64","runner":"windows-latest","target":"aarch64-pc-windows-msvc","args":"--target aarch64-pc-windows-msvc --bundles nsis"},
            {"name":"macOS Apple Silicon","runner":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin"},
            {"name":"macOS Intel","runner":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin"}
          ]'
          if [ "$PRIVATE" != "true" ]; then
            targets=$(echo "$targets" | jq -c '. + [{"name":"Linux ARM64","runner":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu","args":""}]')
          else
            echo "::notice::Repository is private: the Linux ARM64 build is skipped (no ARM64 runners for private repositories)."
          fi
          echo "matrix=$(echo "$targets" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev \
            patchelf rpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

  publish:
    name: Checksums and publish
    needs: [release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Add SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}" --jq .tag_name)
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern '*' --skip-existing
          # The app requires the version in each signature (requireSignedVersion); `tauri build` writes it.
          for sig in *.sig; do
            if ! base64 -d "$sig" | grep -qP "^trusted comment: .*\tversion:\Q${tag#v}\E(\t|$)"; then
              echo "::error::$sig is not signed for version ${tag#v}; the app would refuse this update"; exit 1
            fi
          done
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
      - name: Attest build provenance
        # Attestations need a public repository (or GitHub Enterprise Cloud).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}" -F draft=false -F make_latest=true --jq .html_url
